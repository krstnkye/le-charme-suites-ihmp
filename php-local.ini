; PHP settings for running Le Charme Suites IHMP with C:\Program Files\PHP84
; (its own php.ini has no extensions enabled). Use: php -c php-local.ini ...
extension_dir = "C:\Program Files\PHP84\ext"
extension = openssl
extension = mbstring
extension = fileinfo
extension = curl
extension = pdo_sqlite
extension = sqlite3
extension = zip
extension = intl
extension = gd
memory_limit = 512M
date.timezone = Asia/Manila
